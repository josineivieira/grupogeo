# Review paid compute and disk costs before creating this Blueprint.
services:
  - type: web
    name: geo-rh-api
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build -w backend
    preDeployCommand: npm run db:migrate
    startCommand: npm run start -w backend
    healthCheckPath: /api/healthz
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: WEB_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: UPLOAD_DIR
        value: /var/data/uploads
  - type: web
    name: geo-rh-web
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run build -w frontend
    startCommand: npm run start -w frontend
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: API_INTERNAL_URL
        sync: false
